name: Deploy Aurore Mémoire Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurore-memories-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify the Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Inspect the currently deployed Worker
        shell: bash
        run: |
          set +e
          health="$(curl --silent --show-error --max-time 15 "https://aurore-memories.oualikevin6.workers.dev/health" 2>&1)"
          code=$?
          if [[ $code -ne 0 ]]; then
            echo "::warning::Unable to read the current Worker health endpoint: $health"
            exit 0
          fi
          printf '%s\n' "$health"
          if printf '%s' "$health" | grep -q '"ttsVersion":"2026-10-22-cloudflare-dialog-v1"'; then
            echo "Cloudflare TTS code is already active on the Worker."
          else
            echo "::warning::The active Worker has not yet reported the new Cloudflare TTS version marker."
          fi

      - name: Check Cloudflare credentials are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure the repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before deploying the Worker."
            exit 1
          fi

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: deploy
          workingDirectory: .

      - name: Verify the published Worker and AI binding
        shell: bash
        run: |
          set -euo pipefail
          base="https://aurore-memories.oualikevin6.workers.dev"
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/health")"
          printf '%s\n' "$health"
          printf '%s' "$health" | grep -q '"ok":true'
          printf '%s' "$health" | grep -q '"authConfigured":true'
          printf '%s' "$health" | grep -q '"aiConfigured":true'
          printf '%s' "$health" | grep -q '"ttsVersion":"2026-10-22-cloudflare-dialog-v1"'

          code="$(curl --silent --show-error -o /tmp/tts-response.json -w '%{http_code}' \
            -X POST "$base/api/tts" \
            -H 'Content-Type: application/json' \
            --data '{"text":"health check","language":"fr"}')"
          if [[ "$code" != "401" ]]; then
            echo "::error::The TTS route should reject a request without an Aurore ID token with HTTP 401; got $code."
            cat /tmp/tts-response.json
            exit 1
          fi
          echo "Worker health, Workers AI binding, and authenticated TTS route verified."
