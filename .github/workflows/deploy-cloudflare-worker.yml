name: Deploy Aurore Mémoire Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurore-memories-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify the Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect Worker source changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(worker/|wrangler\.toml$)'; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            echo "Worker source changed in this commit; deployment is required."
          else
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            echo "No Worker source changes in this commit; checking the live Worker."
          fi

      - name: Inspect currently deployed Worker and TTS route
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          base="https://aurore-memories.oualikevin6.workers.dev"
          if ! health="$(curl --fail --silent --show-error --max-time 15 "$base/health")"; then
            echo "worker_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The live Worker health endpoint could not be verified."
            exit 0
          fi
          printf '%s\n' "$health"
          if ! printf '%s' "$health" | grep -q '"ok":true' ||
             ! printf '%s' "$health" | grep -q '"authConfigured":true' ||
             ! printf '%s' "$health" | grep -q '"aiConfigured":true' ||
             ! printf '%s' "$health" | grep -q '"ttsVersion":"2026-10-22-daily-audio-quota-v2"'; then
            echo "worker_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The active Worker is missing the expected Cloudflare TTS version/configuration."
            exit 0
          fi

          code="$(curl --silent --show-error --max-time 15 -o /tmp/tts-response.json -w '%{http_code}' \
            -X POST "$base/api/tts" \
            -H 'Content-Type: application/json' \
            --data '{"text":"health check","language":"fr"}')"
          if [[ "$code" != "401" ]]; then
            echo "worker_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The TTS endpoint returned HTTP $code without authentication; expected 401."
            cat /tmp/tts-response.json
            exit 0
          fi
          echo "worker_ready=true" >> "$GITHUB_OUTPUT"
          echo "Live Worker is healthy, Workers AI is configured, and TTS rejects unauthenticated requests."

      - name: Check Cloudflare credentials
        if: steps.changes.outputs.deploy_needed == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets to deploy changed Worker code."
            exit 1
          fi

      - name: Deploy the Worker
        if: steps.changes.outputs.deploy_needed == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: deploy
          workingDirectory: .

      - name: Verify production Worker
        shell: bash
        run: |
          set -euo pipefail
          base="https://aurore-memories.oualikevin6.workers.dev"
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base/health")"
          printf '%s\n' "$health"
          printf '%s' "$health" | grep -q '"ok":true'
          printf '%s' "$health" | grep -q '"authConfigured":true'
          printf '%s' "$health" | grep -q '"aiConfigured":true'
          printf '%s' "$health" | grep -q '"ttsVersion":"2026-10-22-daily-audio-quota-v2"'

          code="$(curl --silent --show-error -o /tmp/tts-response.json -w '%{http_code}' \
            -X POST "$base/api/tts" \
            -H 'Content-Type: application/json' \
            --data '{"text":"health check","language":"fr"}')"
          if [[ "$code" != "401" ]]; then
            echo "::error::TTS route should reject unauthenticated requests with HTTP 401; got $code."
            cat /tmp/tts-response.json
            exit 1
          fi
          quota_code="$(curl --silent --show-error -o /tmp/tts-quota-response.json -w '%{http_code}' "$base/api/tts/quota")"
          if [[ "$quota_code" != "401" ]]; then
            echo "::error::The quota endpoint should reject unauthenticated requests with HTTP 401; got $quota_code."
            cat /tmp/tts-quota-response.json
            exit 1
          fi
          echo "Production Worker, voice generation, daily quota route, and authentication gates verified."
