name: Android APK — Aurore Mémoire (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurore-memoire-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler l’APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les composants Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Préparer le wrapper Capacitor distant
        run: |
          set -euo pipefail
          mkdir -p android-app/www
          cat > android-app/package.json <<'JSON'
          {
            "name": "aurore-memoire-android",
            "version": "1.0.0",
            "private": true,
            "description": "Wrapper Android officiel pour le site Aurore Mémoire",
            "scripts": {}
          }
          JSON
          cat > android-app/capacitor.config.json <<'JSON'
          {
            "appId": "app.aurore.memoire",
            "appName": "Aurore Mémoire",
            "webDir": "www",
            "server": {
              "url": "https://aurore-memories-mu.vercel.app",
              "androidScheme": "https"
            }
          }
          JSON
          cat > android-app/www/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurore Mémoire</title></head>
          <body><p>Connexion au site Aurore Mémoire…</p></body>
          </html>
          HTML

      - name: Installer Capacitor
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund @capacitor/core@^7 @capacitor/android@^7
          npm install --no-audit --no-fund --save-dev @capacitor/cli@^7

      - name: Générer le projet Android et configurer le retour Aurore ID
        working-directory: android-app
        run: |
          set -euo pipefail
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          if "app.aurore.memoire" not in xml:
              activity_start = xml.find('android:name=".MainActivity"')
              activity_end = xml.find("</activity>", activity_start)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit("Impossible de trouver MainActivity pour le retour Aurore ID.")
              link = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="app.aurore.memoire" android:host="auth" android:pathPrefix="/callback" />
                      </intent-filter>
              """
              xml = xml[:activity_end] + link + xml[activity_end:]
              manifest.write_text(xml)
          print("Lien profond Aurore ID configuré.")
          PY
          npx cap sync android
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/src/main/assets/capacitor.config.json").read_text())
          server = config.get("server", {})
          expected = "https://aurore-memories-mu.vercel.app"
          if server.get("url") != expected or server.get("androidScheme") != "https":
              raise SystemExit(f"Configuration distante inattendue : {server!r}")
          print(f"URL de production intégrée : {server['url']}")
          PY

      - name: Définir le numéro de version
        working-directory: android-app
        run: |
          CODE=$((100 + VERSION_CODE))
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"0.$CODE\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compiler l’APK de test
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer l’APK avec une clé temporaire
        working-directory: android-app/android
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$UNSIGNED" || { echo "APK de sortie introuvable"; exit 1; }
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/aurore-memoire-temp.jks" \
            -storepass temp-build-only -keypass temp-build-only -alias aurore-temp \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Aurore Memoire Temporary Build, OU=Development, O=Aurore, C=BF"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aurore-memoire-aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/aurore-memoire-temp.jks" --ks-key-alias aurore-temp \
            --ks-pass pass:temp-build-only --key-pass pass:temp-build-only \
            --out "$GITHUB_WORKSPACE/Aurore-Memoire.apk" "$RUNNER_TEMP/aurore-memoire-aligned.apk"
          "$BT/apksigner" verify --verbose "$GITHUB_WORKSPACE/Aurore-Memoire.apk"
          rm -f "$RUNNER_TEMP/aurore-memoire-temp.jks"
          echo "::warning::APK signé avec une clé temporaire. Il ne pourra probablement pas mettre à jour une installation signée autrement."
      - name: Vérifier le fichier livré
        run: |
          set -euo pipefail
          test -s Aurore-Memoire.apk
          sha256sum Aurore-Memoire.apk
          {
            echo "## Aurore Mémoire — APK"
            echo ""
            echo "- Le wrapper charge l’adresse stable du site de production."
            echo "- La signature permanente a été vérifiée."
            echo "- Le build ne publie pas d’APK si la clé de signature stable est absente."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déposer l’APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Aurore-Memoire-APK
          path: Aurore-Memoire.apk
          if-no-files-found: error
          retention-days: 14
