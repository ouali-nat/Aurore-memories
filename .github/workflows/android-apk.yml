name: Android APK — Aurore Mémoire (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurore-memoire-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler l’APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les composants Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Préparer le wrapper Capacitor distant
        run: |
          set -euo pipefail
          mkdir -p android-app/www
          cat > android-app/package.json <<'JSON'
          {
            "name": "aurore-memoire-android",
            "version": "1.0.0",
            "private": true,
            "description": "Wrapper Android officiel pour le site Aurore Mémoire",
            "scripts": {}
          }
          JSON
          cat > android-app/capacitor.config.json <<'JSON'
          {
            "appId": "app.aurore.memoire",
            "appName": "Aurore Mémoire",
            "webDir": "www",
          }
          JSON
          cat > android-app/www/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d1b">
            <title>Aurore Mémoire</title>
            <style>
              *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#322044,#100d1b 65%);color:#fff;font:16px system-ui,sans-serif}
              main{width:min(100%,380px);text-align:center;padding:30px 24px;border:1px solid #ffffff24;border-radius:28px;background:#ffffff0b;box-shadow:0 20px 70px #0005}
              .logo{width:76px;height:76px;display:grid;place-items:center;margin:0 auto 20px;border-radius:24px;background:linear-gradient(140deg,#a855f7,#ec4899);box-shadow:0 12px 34px #a855f744}
              h1{margin:0;font-size:1.6rem;letter-spacing:-.04em}p{color:#d7d0e2;line-height:1.55}button{margin-top:12px;border:0;border-radius:14px;padding:13px 20px;background:#f0abfc;color:#26112f;font-weight:700;font-size:1rem}#status{font-size:.92rem}
            </style>
          </head>
          <body><main><div class="logo" aria-hidden="true"><svg viewBox="0 0 40 40" width="48" height="48"><circle cx="20" cy="20" r="16" fill="none" stroke="white" stroke-opacity=".45" stroke-width="1.4"/><path d="M10 25a10 10 0 0 1 20 0M20 9v5M11.8 13.2l3.1 3.1M28.2 13.2l-3.1 3.1M8.5 29.5h23" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="22" r="3.2" fill="white"/></svg></div><h1>Aurore Mémoire</h1><p id="status">Connexion au site sécurisé…</p><button id="retry" type="button" hidden>Réessayer</button></main>
          <script>
            const target = "https://aurore-memories-mu.vercel.app/";
            const statusNode = document.getElementById("status");
            const retry = document.getElementById("retry");
            async function connect(){retry.hidden=true;statusNode.textContent="Connexion au site sécurisé…";try{const response=await fetch(target,{method:"GET",mode:"cors",cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);window.location.replace(target)}catch(error){statusNode.textContent="Le site est momentanément inaccessible depuis cet appareil. Vérifiez votre connexion Internet puis réessayez.";retry.hidden=false}}
            retry.addEventListener("click",connect);connect();
          </script></body></html>
          HTML

      - name: Installer Capacitor
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund @capacitor/core@^7 @capacitor/android@^7
          npm install --no-audit --no-fund --save-dev @capacitor/cli@^7

      - name: Générer le projet Android et configurer le retour Aurore ID
        working-directory: android-app
        run: |
          set -euo pipefail
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          if "app.aurore.memoire" not in xml:
              activity_start = xml.find('android:name=".MainActivity"')
              activity_end = xml.find("</activity>", activity_start)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit("Impossible de trouver MainActivity pour le retour Aurore ID.")
              link = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="app.aurore.memoire" android:host="auth" android:pathPrefix="/callback" />
                      </intent-filter>
              """
              xml = xml[:activity_end] + link + xml[activity_end:]
              manifest.write_text(xml)
          print("Lien profond Aurore ID configuré.")
          PY
          npx cap sync android
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/src/main/assets/capacitor.config.json").read_text())
          server = config.get("server", {})
          if server.get("url"):
              raise SystemExit(f"Le wrapper doit démarrer localement pour afficher le logo et le diagnostic réseau : {server!r}")
          print("Écran local de démarrage vérifié; il teste le site distant avant navigation.")
          PY

      - name: Définir le numéro de version
        working-directory: android-app
        run: |
          CODE=$((100 + VERSION_CODE))
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"0.$CODE\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compiler l’APK de test
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer l’APK avec une clé temporaire
        working-directory: android-app/android
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$UNSIGNED" || { echo "APK de sortie introuvable"; exit 1; }
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/aurore-memoire-temp.jks" \
            -storepass temp-build-only -keypass temp-build-only -alias aurore-temp \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Aurore Memoire Temporary Build, OU=Development, O=Aurore, C=BF"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aurore-memoire-aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/aurore-memoire-temp.jks" --ks-key-alias aurore-temp \
            --ks-pass pass:temp-build-only --key-pass pass:temp-build-only \
            --out "$GITHUB_WORKSPACE/Aurore-Memoire.apk" "$RUNNER_TEMP/aurore-memoire-aligned.apk"
          "$BT/apksigner" verify --verbose "$GITHUB_WORKSPACE/Aurore-Memoire.apk"
          rm -f "$RUNNER_TEMP/aurore-memoire-temp.jks"
          echo "::warning::APK signé avec une clé temporaire. Il ne pourra probablement pas mettre à jour une installation signée autrement."
      - name: Vérifier le fichier livré
        run: |
          set -euo pipefail
          test -s Aurore-Memoire.apk
          sha256sum Aurore-Memoire.apk
          {
            echo "## Aurore Mémoire — APK"
            echo ""
            echo "- Le wrapper charge l’adresse stable du site de production."
            echo "- La signature permanente a été vérifiée."
            echo "- Le build ne publie pas d’APK si la clé de signature stable est absente."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déposer l’APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Aurore-Memoire-APK
          path: Aurore-Memoire.apk
          if-no-files-found: error
          retention-days: 14
