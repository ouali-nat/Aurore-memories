name: Aurore Mémoire JavaScript syntax

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check card library scripts
        run: |
          node --check memoire.js
          node --check cartes.js
          node --check learning-sharing.js
          node --check public-card-flip.js
          node --check bulk-card-import.js
          node --check qcm.js
          node --check qcm-text-import.js
          node --check aurora-page-prompt.js
          node tests/card-storage.test.js
          node tests/qcm-text-import.test.js
          node tests/qcm-generation.test.js
      - name: Validate web app manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('site.webmanifest', 'utf8'))"
